<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Tracker — Login</title>
<meta name="theme-color" content="#0B2545">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="offline-banner" id="offlineBanner"><span class="material-icons" style="font-size:16px">cloud_off</span> You're offline — actions will sync automatically</div>

<div class="app-shell">

  <div class="login-hero">
    <div class="logo-badge"><span class="material-icons">warehouse</span></div>
    <h1>Warehouse Tracker</h1>
    <p>Employee sign-in &middot; camera &amp; GPS verified</p>
  </div>

  <div class="login-form-wrap">
    <div class="login-card">

      <!-- Tabs: Employee / Admin -->
      <div class="btn-grid" style="margin-bottom:18px;">
        <button class="btn btn-primary" id="tabEmployee" style="width:100%">Employee</button>
        <button class="btn btn-outline" id="tabAdmin" style="width:100%">Admin</button>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="employeeId">Employee ID</label>
          <input type="text" id="employeeId" placeholder="e.g. EMP1023" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <!-- GPS status (employee only) -->
        <div id="gpsSection">
          <div class="gps-status-row pending" id="gpsStatusRow">
            <span class="material-icons">gps_not_fixed</span>
            <span id="gpsStatusText">Requesting GPS permission…</span>
          </div>
        </div>

        <!-- Selfie capture (employee only) -->
        <div class="field" id="selfieSection">
          <label>Selfie Verification</label>
          <div class="camera-box" id="cameraBox">
            <video id="cameraVideo" autoplay playsinline muted style="display:none;"></video>
            <img id="selfiePreview" style="display:none;">
            <div class="placeholder" id="cameraPlaceholder">
              <span class="material-icons" style="font-size:32px;">photo_camera</span><br>Camera preview will appear here
            </div>
          </div>
          <div class="camera-controls">
            <button type="button" class="btn btn-outline btn-sm" id="startCameraBtn" style="flex:1;">
              <span class="material-icons">videocam</span> Start Camera
            </button>
            <button type="button" class="btn btn-primary btn-sm" id="captureBtn" style="flex:1;" disabled>
              <span class="material-icons">camera</span> Capture
            </button>
            <button type="button" class="btn btn-outline btn-sm" id="retakeBtn" style="flex:1; display:none;">
              <span class="material-icons">replay</span> Retake
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="margin-top:6px;" disabled>
          <span class="material-icons">login</span> Sign In
        </button>
      </form>

      <p class="muted" style="text-align:center;margin-top:16px;">Warehouse Tracker PWA &middot; v1.0</p>
    </div>
  </div>
</div>

<div id="toast-root"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
